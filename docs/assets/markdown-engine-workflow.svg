<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Markdown Engine workflow preview</title>
  <desc id="desc">A product workflow diagram showing profile YAML and Markdown validated into stable JSON diagnostics.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101510"/>
      <stop offset="0.54" stop-color="#1b251d"/>
      <stop offset="1" stop-color="#182f2f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#backdrop)"/>
  <rect x="86" y="72" width="1428" height="856" rx="28" fill="#eef4ef" opacity="0.05" stroke="#d7dfd7" stroke-opacity="0.12"/>

  <text x="120" y="150" fill="#f6fbf6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="800">Markdown Engine</text>
  <text x="120" y="200" fill="#b8f0d6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700">GFM + YAML in | Rich IR + diagnostics out</text>

  <g filter="url(#softShadow)">
    <rect x="120" y="278" width="386" height="444" rx="18" fill="#121611" stroke="#49624f" stroke-width="2"/>
    <rect x="120" y="278" width="386" height="58" rx="18" fill="#1e2a20"/>
    <rect x="120" y="318" width="386" height="18" fill="#1e2a20"/>
    <circle cx="154" cy="307" r="8" fill="#b8332a"/>
    <circle cx="180" cy="307" r="8" fill="#b86412"/>
    <circle cx="206" cy="307" r="8" fill="#0d6f54"/>
    <text x="236" y="315" fill="#dce7dc" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">profile.yaml</text>
    <text x="148" y="382" fill="#b8f0d6" font-family="Menlo, Consolas, monospace" font-size="22">syntaxVersion:</text>
    <text x="148" y="416" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">  markdown-engine.validation@v1</text>
    <text x="148" y="468" fill="#b8f0d6" font-family="Menlo, Consolas, monospace" font-size="22">rules:</text>
    <text x="148" y="502" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">- id: gate.table.columns</text>
    <text x="148" y="536" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">  select: table</text>
    <text x="148" y="570" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">  assert: columns</text>
    <text x="148" y="604" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">    ID, Gate, Status</text>
    <text x="148" y="666" fill="#91d7d9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Closed YAML-friendly profile data</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="608" y="248" width="386" height="504" rx="18" fill="#121611" stroke="#49624f" stroke-width="2"/>
    <rect x="608" y="248" width="386" height="58" rx="18" fill="#1e2a20"/>
    <rect x="608" y="288" width="386" height="18" fill="#1e2a20"/>
    <circle cx="642" cy="277" r="8" fill="#b8332a"/>
    <circle cx="668" cy="277" r="8" fill="#b86412"/>
    <circle cx="694" cy="277" r="8" fill="#0d6f54"/>
    <text x="724" y="285" fill="#dce7dc" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">release.md</text>
    <text x="636" y="352" fill="#b8f0d6" font-family="Menlo, Consolas, monospace" font-size="22">---</text>
    <text x="636" y="386" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">title: Release Checklist</text>
    <text x="636" y="420" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">owner: release-team</text>
    <text x="636" y="454" fill="#b8f0d6" font-family="Menlo, Consolas, monospace" font-size="22">---</text>
    <text x="636" y="516" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22"># Gate Table</text>
    <text x="636" y="568" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">| ID | Gate | Status |</text>
    <text x="636" y="602" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">| REL-GATE-1 | Docs | ready |</text>
    <text x="636" y="664" fill="#91d7d9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Human-readable Markdown remains the source</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1096" y="278" width="386" height="444" rx="18" fill="#121611" stroke="#49624f" stroke-width="2"/>
    <rect x="1096" y="278" width="386" height="58" rx="18" fill="#1e2a20"/>
    <rect x="1096" y="318" width="386" height="18" fill="#1e2a20"/>
    <circle cx="1130" cy="307" r="8" fill="#b8332a"/>
    <circle cx="1156" cy="307" r="8" fill="#b86412"/>
    <circle cx="1182" cy="307" r="8" fill="#0d6f54"/>
    <text x="1212" y="315" fill="#dce7dc" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">validation.json</text>
    <text x="1124" y="382" fill="#b8f0d6" font-family="Menlo, Consolas, monospace" font-size="22">{</text>
    <text x="1124" y="416" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">  "valid": true,</text>
    <text x="1124" y="450" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">  "profile": {</text>
    <text x="1124" y="484" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">    "ruleCount": 8</text>
    <text x="1124" y="518" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">  },</text>
    <text x="1124" y="552" fill="#edf7ed" font-family="Menlo, Consolas, monospace" font-size="22">  "diagnostics": []</text>
    <text x="1124" y="586" fill="#b8f0d6" font-family="Menlo, Consolas, monospace" font-size="22">}</text>
    <text x="1124" y="666" fill="#91d7d9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Stable evidence for CI and review</text>
  </g>

  <line x1="526" y1="500" x2="586" y2="500" stroke="#b8f0d6" stroke-width="6" stroke-linecap="round"/>
  <polygon points="586,500 564,486 564,514" fill="#b8f0d6"/>
  <line x1="1014" y1="500" x2="1074" y2="500" stroke="#b8f0d6" stroke-width="6" stroke-linecap="round"/>
  <polygon points="1074,500 1052,486 1052,514" fill="#b8f0d6"/>

  <g>
    <rect x="120" y="804" width="292" height="68" rx="12" fill="#b8f0d6"/>
    <text x="156" y="847" fill="#082117" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">Local-only validation</text>
    <rect x="460" y="804" width="250" height="68" rx="12" fill="#91d7d9"/>
    <text x="496" y="847" fill="#082117" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">Stable JSON</text>
    <rect x="758" y="804" width="382" height="68" rx="12" fill="#f0c076"/>
    <text x="794" y="847" fill="#2b1700" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">Document contract 1.0.0</text>
  </g>
</svg>
