syntaxVersion: markdown-engine.validation@v1
documentVersion: 1.0.0
rules:
  - id: frontmatter.required
    select:
      target: document
    assert:
      frontmatterRequired:
        fields:
          - title
          - release
          - owner

  - id: sections.required
    select:
      target: document
    assert:
      sectionsRequired:
        order: strict
        headings:
          - Release Checklist
          - Gate Table
          - Links

  - id: checklist.list
    select:
      target: list
      section: Release Checklist
      ordered: false
    assert:
      text:
        contains: "Verify package"
        excludes:
          - "manual bypass"

  - id: gate.table.columns
    select:
      target: table
      section: Gate Table
      header:
        - ID
        - Gate
        - Status
    assert:
      tableColumnsRequired:
        columns:
          - ID
          - Gate
          - Status

  - id: gate.ids.unique
    select:
      target: tableCell
      section: Gate Table
      column: ID
    assert:
      ids:
        prefix: REL-GATE
        unique: true

  - id: ready.gate.row
    select:
      target: tableRow
      section: Gate Table
      tableHeader:
        - ID
        - Gate
        - Status
      where:
        column: Gate
        equals: "Contract docs"
    assert:
      text:
        contains: ready

  - id: status.ready.count
    select:
      target: tableCell
      section: Gate Table
      column: Status
      rowWhere:
        column: ID
        equals: REL-GATE-1
    assert:
      textOccurrenceCount:
        text: ready
        count: 1

  - id: release.link
    select:
      target: link
      section: Links
      text: "release notes"
      url: "./release-notes.md"
    assert:
      exists: true
