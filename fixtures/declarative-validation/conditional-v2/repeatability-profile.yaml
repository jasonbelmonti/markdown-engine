syntaxVersion: markdown-engine.validation@v2
documentVersion: "1.0.0"
rules:
  - id: repeatability.flat.text
    select:
      target: section
      title: Mission
    assert:
      text:
        contains: launch
  - id: repeatability.grouped.anyof
    anyOf:
      - label: verification-section
        select:
          target: section
          title: Verification
        assert:
          exists: true
      - label: mission-ready
        select:
          target: section
          title: Mission
        assert:
          text:
            contains: Ready
  - id: repeatability.when.skipped
    when:
      select:
        target: section
        title: Verification
      assert:
        exists: true
    select:
      target: document
    assert:
      text:
        contains: DO NOT EVALUATE
  - id: repeatability.ids.count
    select:
      target: tableCell
      column: ID
    assert:
      ids:
        prefix: REQ
        minCount: 2
        maxCount: 2
  - id: repeatability.table.coverage
    select:
      target: document
    assert:
      tableColumnCoverage:
        source:
          section: Requirements
          column: ID
          prefix: REQ
        target:
          section: Traceability
          column: Requirement
        require: everySourceId
