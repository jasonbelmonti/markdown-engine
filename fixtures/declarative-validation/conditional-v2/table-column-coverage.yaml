          sourceLine: 6
      compiledAssertions:
        - ruleId: coverage.narrative-text
          source:
            section: Requirements
            column: ID
            prefix: REQ
          target:
            section: Traceability
            column: Requirement

  - name: missing-target-section
    contract: emit a source-grounded diagnostic when the configured target section is absent
    markdown: |
      # Requirements

      | ID | Statement |
      | --- | --- |
      | REQ-1 | Build safely |
    profile:
      syntaxVersion: markdown-engine.validation@v2
      documentVersion: "1.0.0"
      rules:
        - id: coverage.missing-section
          select:
            target: document
          assert:
            tableColumnCoverage:
              source:
                section: Requirements
                column: ID
                prefix: REQ
              target:
                section: Traceability
                column: Requirement
              require: everySourceId
    expected:
      valid: false
      diagnostics:
        - code: profile.validation.tableColumnCoverageTargetSectionMissing
          ruleId: coverage.missing-section
          message: 'ID "REQ-1" requires target section "Traceability" for tableColumnCoverage.'
          sourceLine: 5
      compiledAssertions:
        - ruleId: coverage.missing-section
          source:
            section: Requirements
            column: ID
            prefix: REQ
          target:
            section: Traceability
            column: Requirement

