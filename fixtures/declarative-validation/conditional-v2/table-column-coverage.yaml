          ruleId: coverage.later-source-evidence
          message: 'ID "REQ-1" must appear in target table column "Requirement" of section "Traceability".'
          sourceLine: 6
      compiledAssertions:
        - ruleId: coverage.later-source-evidence
          source:
            section: Requirements
            column: ID
            prefix: REQ
          target:
            section: Traceability
            column: Requirement

  - name: case-insensitive-pass
    contract: use source case sensitivity when comparing source and target IDs
    markdown: |
      # Requirements

      | ID | Statement |
      | --- | --- |
      | req-1 | Build safely |

      # Traceability

      | Requirement | Evidence |
      | --- | --- |
      | REQ-1 | Unit test |
    profile:
      syntaxVersion: markdown-engine.validation@v2
      documentVersion: "1.0.0"
      rules:
        - id: coverage.case-insensitive
          select:
            target: document
          assert:
            tableColumnCoverage:
              source:
                section: Requirements
                column: ID
                prefix: req
                caseSensitive: false
              target:
                section: Traceability
                column: Requirement
              require: everySourceId
    expected:
      valid: true
      compiledAssertions:
        - ruleId: coverage.case-insensitive
          source:
            section: Requirements
            column: ID
            prefix: req
            caseSensitive: false
          target:
            section: Traceability
            column: Requirement
