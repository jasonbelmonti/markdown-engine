cases:
  - name: coverage-pass
    contract: pass when every source ID appears in the configured target table column
    markdown: |
      # Requirements

      | ID | Statement |
      | --- | --- |
      | REQ-1 | Build safely |
      | REQ-2 | Launch safely |

      # Traceability

      | Requirement | Evidence |
      | --- | --- |
      | REQ-1 | Unit test |
      | REQ-2 | Integration test |
    profile:
      syntaxVersion: markdown-engine.validation@v2
      documentVersion: "1.0.0"
      rules:
        - id: coverage.pass
          select:
            target: document
          assert:
            tableColumnCoverage:
              source:
                section: Requirements
                column: ID
                prefix: REQ
              target:
                section: Traceability
                tableHeader:
                  - Requirement
                  - Evidence
                column: Requirement
              require: everySourceId
    expected:
      valid: true
      compiledAssertions:
        - ruleId: coverage.pass
          source:
            section: Requirements
            column: ID
            prefix: REQ
          target:
            section: Traceability
            tableHeader:
              - Requirement
              - Evidence
            column: Requirement

  - name: wrong-target-column-fail
    contract: fail when an ID appears elsewhere in the target section but not the configured target column
    markdown: |
      # Requirements

      | ID | Statement |
      | --- | --- |
      | REQ-1 | Build safely |
      | REQ-2 | Launch safely |

      # Traceability

      | Requirement | Evidence |
      | --- | --- |
      | REQ-1 | Unit test |
      | Design note | REQ-2 appears outside the target column |
    profile:
      syntaxVersion: markdown-engine.validation@v2
      documentVersion: "1.0.0"
      rules:
        - id: coverage.wrong-column
          select:
            target: document
          assert:
            tableColumnCoverage:
              source:
                section: Requirements
                column: ID
                prefix: REQ
              target:
                section: Traceability
                column: Requirement
              require: everySourceId
    expected:
      valid: false
      diagnostics:
        - code: profile.validation.tableColumnCoverageIdMissing
          ruleId: coverage.wrong-column
          message: 'ID "REQ-2" must appear in target table column "Requirement" of section "Traceability".'
          sourceLine: 6
      compiledAssertions:
        - ruleId: coverage.wrong-column
          source:
            section: Requirements
            column: ID
            prefix: REQ
          target:
            section: Traceability
            column: Requirement

