  - name: later-duplicate-source-evidence
    contract: use later duplicate source evidence when the first matching source ID has no source range
    stripFirstDataCellSourceEvidence: true
    markdown: |
      # Requirements

      | ID | Statement |
      | --- | --- |
      | REQ-1 | First source occurrence has no source evidence |
      | REQ-1 | Later source occurrence has source evidence |

      # Traceability

      | Requirement | Evidence |
      | --- | --- |
      | Design note | REQ-1 appears outside the target column |
    profile:
      syntaxVersion: markdown-engine.validation@v2
      documentVersion: "1.0.0"
      rules:
        - id: coverage.later-source-evidence
          select:
            target: document
          assert:
