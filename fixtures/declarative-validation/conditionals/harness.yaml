  - name: l8e-mixed-id-count-pass
    contract: pass when mixed downstream ID families satisfy prefix-filtered count bounds
    markdown: |
      # 5. Requirements

      | ID | Statement |
      | --- | --- |
      | REQ-1 | The downstream document SHALL count requirement IDs. |
      | CTRL-1 | The downstream document SHALL keep control IDs separate. |
      | REQ-2 | The downstream document SHALL ignore non-requirement IDs for REQ counts. |
      | EVD-1 | The downstream document SHALL keep evidence IDs separate. |
    profile:
      syntaxVersion: markdown-engine.validation@v2
      documentVersion: "1.0.0"
      rules:
        - id: conditionals.downstream.mixed-id-count.requirements.pass
          select:
            target: tableCell
            section: 5. Requirements
            column: ID
          assert:
            ids:
              prefix: REQ
              minCount: 2
