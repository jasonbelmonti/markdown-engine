  - name: l8d-r1-traceability-standard-pass
    contract: pass when R1 traceability satisfies the standard Section 11 matrix branch
    markdown: |
      # Document Control

      | Field | Value |
      | --- | --- |
      | Rigor level | R1 |

      # 5. Requirements

      | ID | Statement |
      | --- | --- |
      | REQ-1 | The R1 standard path SHALL trace required behavior. |

      # 11. Requirements-to-Behavior Traceability

      | Requirement | Behavior |
      | --- | --- |
      | REQ-1 | Behavior trace entry |

      # 17. Verification Strategy and Behavior-to-Mechanism Traceability

      | Requirement | Verification |
      | --- | --- |
      | Replacement note | REQ-1 appears in non-target verification text |
    profile:
      syntaxVersion: markdown-engine.validation@v2
      documentVersion: "1.0.0"
      rules:
        - id: conditionals.downstream.r1-traceability.standard.pass
          when:
            select:
              target: tableCell
              section: Document Control
              tableHeader:
                - Field
                - Value
              column: Value
              rowWhere:
                column: Field
                equals: Rigor level
            assert:
              text:
                contains: R1
          anyOf:
            - label: section11-standard
              select:
                target: document
              assert:
                tableColumnCoverage:
                  source:
                    section: 5. Requirements
                    column: ID
                    prefix: REQ
                  target:
                    section: 11. Requirements-to-Behavior Traceability
                    tableHeader:
                      - Requirement
                      - Behavior
                    column: Requirement
                  require: everySourceId
            - label: section17-replacement
              select:
                target: document
              assert:
                tableColumnCoverage:
                  source:
                    section: 5. Requirements
                    column: ID
                    prefix: REQ
                  target:
                    section: 17. Verification Strategy and Behavior-to-Mechanism Traceability
                    tableHeader:
                      - Requirement
                      - Verification
                    column: Requirement
                  require: everySourceId
    expected:
      valid: true
      profile:
        ruleCount: 1
        evaluatedRuleCount: 1
        skippedRuleCount: 0
      ruleResults:
        - ruleId: conditionals.downstream.r1-traceability.standard.pass
          status: passed
          passed: true
          evaluation:
            kind: anyOf
            selectedBranch:
              branchIndex: 0
              label: section11-standard
            branches:
              - branchIndex: 0
                label: section11-standard
                status: passed
              - branchIndex: 1
                label: section17-replacement
                status: failed
                diagnostics:
                  - code: profile.validation.tableColumnCoverageIdMissing
                    ruleId: conditionals.downstream.r1-traceability.standard.pass
                    message: 'ID "REQ-1" must appear in target table column "Requirement" of section "17. Verification Strategy and Behavior-to-Mechanism Traceability".'
                    sourceLine: 11

